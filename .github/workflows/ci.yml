name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Create the virtual environment
        # A venv, not --system: the runner's /usr Python is externally managed
        # (PEP 668) and is a fixed version, so --system both fails and silently
        # ignores the matrix.
        run: uv venv --python ${{ matrix.python-version }} .venv

      - name: Verify the interpreter matches the matrix
        run: |
          actual=$(.venv/bin/python -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')
          echo "Matrix asked for ${{ matrix.python-version }}, venv has $actual"
          test "$actual" = "${{ matrix.python-version }}"

      - name: Install dependencies
        run: uv pip install -e ".[dev]"

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Check formatting
        run: .venv/bin/ruff format --check .

      - name: Test
        run: .venv/bin/pytest --cov=fortnox --cov-report=term-missing

      - name: Check the Fortnox object notes are regenerated, not hand-edited
        # They are derived from the OpenAPI spec; an edit by hand would be silently
        # undone by the next regeneration, so catch it here instead.
        run: .venv/bin/python .claude/skills/fortnox/scripts/generate_object_notes.py --check
